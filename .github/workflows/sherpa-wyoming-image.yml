name: Sherpa Wyoming image CI

on:
  push:
    branches:
      - feature/p7a-sherpa-wyoming-service
    paths:
      - .github/workflows/sherpa-wyoming-image.yml
      - services/sherpa_wyoming/**
      - deploy/nas/compose/sherpa-wyoming.yml
      - deploy/nas/config/sherpa-wyoming/**
      - deploy/nas/scripts/prepare-sherpa-wyoming-models.sh
      - tests/services/sherpa_wyoming/**
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/sherpa-wyoming-image.yml
      - services/sherpa_wyoming/**
      - deploy/nas/compose/sherpa-wyoming.yml
      - deploy/nas/config/sherpa-wyoming/**
      - deploy/nas/scripts/prepare-sherpa-wyoming-models.sh
      - tests/services/sherpa_wyoming/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Docker image and Compose validation (amd64)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify runner architecture
        shell: bash
        run: |
          test "$(uname -m)" = "x86_64"
          test "$(dpkg --print-architecture)" = "amd64"
          echo "GitHub-hosted runner architecture: $(uname -m) / $(dpkg --print-architecture)"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4.4.1
        with:
          platforms: linux/amd64

      - name: Verify linux/amd64 builder
        shell: bash
        run: |
          builder="$(docker buildx inspect --bootstrap)"
          printf '%s\n' "$builder"
          grep -Eq '^Platforms:.*linux/amd64' <<< "$builder"

      - name: Check Dockerfile
        working-directory: services/sherpa_wyoming
        run: docker buildx build --check --file Dockerfile .

      - name: Build linux/amd64 runtime image
        working-directory: services/sherpa_wyoming
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --target runtime \
            --load \
            --file Dockerfile \
            --tag tivoo-sherpa-wyoming:runtime .

      - name: Build linux/amd64 CI smoke image
        working-directory: services/sherpa_wyoming
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --target ci-smoke \
            --load \
            --file Dockerfile \
            --tag tivoo-sherpa-wyoming:ci-smoke .

      - name: Run dependency, model API and entrypoint import smoke
        run: docker run --rm tivoo-sherpa-wyoming:ci-smoke

      - name: Validate Compose configuration
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/sherpa-wyoming.env" <<'EOF'
          IMAGE_TAG=ci-validation
          HA_DOCKER_NETWORK=existing-ha-network
          NAS_MODELS_DIR=/tmp/sherpa-wyoming-models
          WAKE_WORD_PHRASE=ci-placeholder
          EOF
          docker compose \
            --env-file "$RUNNER_TEMP/sherpa-wyoming.env" \
            --file deploy/nas/compose/sherpa-wyoming.yml \
            config --quiet

      - name: Record validation boundary
        run: |
          {
            echo '## Sherpa Wyoming image validation'
            echo '- Runner: ubuntu-24.04 / linux/amd64'
            echo '- Dockerfile check, runtime image build and dependency/entrypoint smoke: passed'
            echo '- Compose config: passed'
            echo '- No model weights are included in the image'
            echo '- NAS deployment and runtime model smoke remain assigned to P7Ab8'
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish immutable GHCR SHA tag
    if: github.event_name == 'push' && github.ref == 'refs/heads/feature/p7a-sherpa-wyoming-service'
    needs: validate
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4.4.1
        with:
          platforms: linux/amd64

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish immutable linux/amd64 image
        uses: docker/build-push-action@v6
        with:
          context: ./services/sherpa_wyoming
          file: ./services/sherpa_wyoming/Dockerfile
          platforms: linux/amd64
          target: runtime
          push: true
          tags: ghcr.io/qyxx2/tivoo-sherpa-wyoming:sha-${{ github.sha }}

      - name: Record published image
        run: echo "Published ghcr.io/qyxx2/tivoo-sherpa-wyoming:sha-${GITHUB_SHA}" >> "$GITHUB_STEP_SUMMARY"
