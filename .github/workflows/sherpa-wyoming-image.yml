name: Sherpa Wyoming image CI

on:
  push:
    branches:
      - feature/p7a-sherpa-wyoming-service
    paths:
      - .github/workflows/sherpa-wyoming-image.yml
      - services/sherpa_wyoming/**
      - deploy/nas/compose/sherpa-wyoming.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/sherpa-wyoming-image.yml
      - services/sherpa_wyoming/**
      - deploy/nas/compose/sherpa-wyoming.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sherpa-wyoming-image-smoke:
    name: Dockerfile check and linux/amd64 dependency smoke
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify runner architecture
        shell: bash
        run: |
          test "$(uname -m)" = "x86_64"
          test "$(dpkg --print-architecture)" = "amd64"
          echo "GitHub-hosted runner architecture: $(uname -m) / $(dpkg --print-architecture)"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4.4.1
        with:
          platforms: linux/amd64

      - name: Verify linux/amd64 builder
        shell: bash
        run: |
          builder="$(docker buildx inspect --bootstrap)"
          printf '%s\n' "$builder"
          grep -Eq '^Platforms:.*linux/amd64' <<< "$builder"

      - name: Check Dockerfile
        working-directory: services/sherpa_wyoming
        run: docker buildx build --check --file Dockerfile .

      - name: Build linux/amd64 dependency smoke image
        working-directory: services/sherpa_wyoming
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --target ci-smoke \
            --load \
            --file Dockerfile \
            --tag tivoo-sherpa-wyoming:ci-smoke .

      - name: Run dependency and model API smoke
        run: docker run --rm tivoo-sherpa-wyoming:ci-smoke

      - name: Record image destination
        run: |
          echo 'Reserved GHCR image: ghcr.io/qyxx2/tivoo-sherpa-wyoming' >> "$GITHUB_STEP_SUMMARY"
          echo 'This batch checks the Dockerfile and runs a linux/amd64 dependency/API import smoke. Image publishing, Compose validation and deployment remain assigned to P7Ab7.' >> "$GITHUB_STEP_SUMMARY"
